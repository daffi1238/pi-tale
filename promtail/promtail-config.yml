# pi-tale — Promtail configuration.
#
# Ships two log streams to Loki:
#   1. Host syslog (and friends) from /var/log on the Raspberry Pi.
#   2. Docker container logs from /var/lib/docker/containers.
#
# The container scraper relies on Docker's JSON log driver; if you change
# the daemon's logging driver in /etc/docker/daemon.json, update the
# pipeline_stages accordingly.

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  - job_name: system
    static_configs:
      - targets: [localhost]
        labels:
          job: varlogs
          host: pi-tale
          __path__: /var/log/{syslog,auth.log,kern.log,daemon.log,messages}

  - job_name: containers
    static_configs:
      - targets: [localhost]
        labels:
          job: docker
          host: pi-tale
          __path__: /var/lib/docker/containers/*/*.log
    pipeline_stages:
      - json:
          expressions:
            log: log
            stream: stream
            time: time
      - regex:
          source: filename
          expression: '/var/lib/docker/containers/(?P<container_id>[^/]+)/'
      - labels:
          stream:
          container_id:
      - timestamp:
          source: time
          format: RFC3339Nano
      - output:
          source: log
