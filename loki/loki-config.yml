# pi-tale — Loki single-binary configuration tuned for a Raspberry Pi.
#
# Storage is local filesystem (no S3, no Minio). Retention defaults to 30
# days; tweak `limits_config.retention_period` for your environment.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  instance_addr: 127.0.0.1

memberlist:
  join_members: []

ingester:
  chunk_idle_period: 1h
  max_chunk_age: 1h
  chunk_target_size: 1048576       # 1 MB
  chunk_retain_period: 30s

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache
  filesystem:
    directory: /loki/chunks

compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true

limits_config:
  retention_period: 30d
  # Backfill allowed: the VPS ships auditd/journald batches that may carry
  # timestamps older than the default 1w window (e.g. after a WG outage or
  # an Alloy restart replaying its WAL). Rejecting them would silently drop
  # real events, so accept out-of-order/old samples.
  reject_old_samples: false
  reject_old_samples_max_age: 168h
  max_query_series: 5000

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-temp
  alertmanager_url: http://alertmanager:9093
  ring:
    kvstore:
      store: inmemory
  enable_api: true

analytics:
  reporting_enabled: false
