# Add this server block (or paste the `location` into an existing
# localhost-only server) so nginx-prometheus-exporter has something to
# scrape. The block ONLY accepts connections from the host (127.0.0.1) —
# the exporter container talks to it via host.docker.internal.
#
# Put this file under /etc/nginx/conf.d/stub_status.conf and reload
# nginx (`nginx -t && systemctl reload nginx`).

server {
    listen 127.0.0.1:80;
    server_name _;

    location = /stub_status {
        stub_status;
        # Hardening: only accept the loopback address. Without this
        # someone with network access to the host could enumerate
        # connection counts.
        allow 127.0.0.1;
        deny  all;
        access_log off;
    }
}
