# pi-tale — Prometheus configuration.
#
# Scrape jobs are intentionally kept short here. To monitor additional
# devices (UniFi APs through unifi-poller, SNMP hosts, custom exporters)
# drop a target file into ./targets/*.yml and Prometheus will pick it up
# automatically via file_sd_configs.

global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    monitor: pi-tale
    site: "${SITE:-default}"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:

  # --- pi-tale internal services -------------------------------------------

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: loki
    metrics_path: /metrics
    static_configs:
      - targets: ["loki:3100"]

  - job_name: promtail
    metrics_path: /metrics
    static_configs:
      - targets: ["promtail:9080"]

  # --- Host & containers ---------------------------------------------------

  - job_name: node_exporter
    static_configs:
      - targets: ["node_exporter:9100"]
        labels:
          host: pi-tale-node

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # --- Blackbox: reachability probes --------------------------------------
  #
  # Targets live in ./targets/blackbox-*.yml (file_sd). For each module
  # there is one scrape job that rewrites the address through the
  # blackbox exporter (relabel pattern from the upstream docs).

  - job_name: blackbox_icmp
    metrics_path: /probe
    params:
      module: [icmp]
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/blackbox-icmp-*.yml
        refresh_interval: 1m
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox_exporter:9115

  - job_name: blackbox_http
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/blackbox-http-*.yml
        refresh_interval: 1m
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox_exporter:9115

  - job_name: blackbox_tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/blackbox-tcp-*.yml
        refresh_interval: 1m
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox_exporter:9115

  # --- Future targets (UniFi, SNMP, custom) -------------------------------
  #
  # Generic file_sd that picks up anything under targets/static-*.yml
  # with a label `job` to namespace them. Use it for one-off exporters
  # you do not want a dedicated scrape config for.

  - job_name: file_sd
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/static-*.yml
        refresh_interval: 1m
