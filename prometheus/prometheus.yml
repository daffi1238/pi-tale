# pi-tale — Prometheus configuration.
#
# Scrape jobs are intentionally kept short here. To monitor additional
# devices (UniFi APs through unifi-poller, SNMP hosts, custom exporters)
# drop a target file into ./targets/*.yml and Prometheus will pick it up
# automatically via file_sd_configs.

global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    monitor: pi-tale
    site: "${SITE:-default}"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:

  # --- pi-tale internal services -------------------------------------------

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: loki
    metrics_path: /metrics
    static_configs:
      - targets: ["loki:3100"]

  - job_name: promtail
    metrics_path: /metrics
    static_configs:
      - targets: ["promtail:9080"]

  # --- Host & containers ---------------------------------------------------

  - job_name: node_exporter
    static_configs:
      - targets: ["node_exporter:9100"]
        labels:
          host: pi-tale-node

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # --- Blackbox: reachability probes --------------------------------------
  #
  # Targets live in ./targets/blackbox-*.yml (file_sd). For each module
  # there is one scrape job that rewrites the address through the
  # blackbox exporter (relabel pattern from the upstream docs).

  - job_name: blackbox_icmp
    metrics_path: /probe
    params:
      module: [icmp]
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/blackbox-icmp-*.yml
        refresh_interval: 1m
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox_exporter:9115

  # ICMP probes for hosts INSIDE the WG overlay (10.0.0.0/24). Routed
  # through a second blackbox instance (blackbox_vpn, compose/wireguard.yml)
  # that shares the gateway's netns and therefore sees wg0 directly. The
  # glob is `vpn-icmp-*.yml`, deliberately distinct from `blackbox-icmp-*`
  # so the LAN job above does NOT also pick up these targets.
  - job_name: blackbox_icmp_vpn
    metrics_path: /probe
    params:
      module: [icmp]
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/vpn-icmp-*.yml
        refresh_interval: 1m
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: wireguard_gateway:9115

  - job_name: blackbox_http
    metrics_path: /probe
    # Default module if a target file does not override it via a `module`
    # label. Per-target overrides are picked up by the relabel rule
    # below, allowing site-specific modules (e.g. with a title regex) to
    # coexist with the generic http_2xx liveness check.
    params:
      module: [http_2xx]
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/blackbox-http-*.yml
        refresh_interval: 1m
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      # If the target file carries a `module` label, route the probe
      # through that module. The `regex: (.+)` guard keeps the default
      # in place when the label is absent or empty.
      - source_labels: [module]
        regex: (.+)
        target_label: __param_module
      - target_label: __address__
        replacement: blackbox_exporter:9115

  # --- WireGuard health (compose/wireguard.yml) ---------------------------
  #
  # The wireguard_exporter shares the gateway's network namespace
  # (`network_mode: service:wireguard_gateway`) — needed so it can see
  # the wg0 interface, which lives only inside the gateway container.
  # As a side effect, its :9586 listener is reachable from the pitale
  # bridge at `wireguard_gateway:9586` (the gateway's hostname).
  #
  # Metrics exposed:
  #   wireguard_latest_handshake_seconds (timestamp, seconds since epoch)
  #   wireguard_sent_bytes_total
  #   wireguard_received_bytes_total
  #
  # The WireguardTunnelDown rule (prometheus/rules/vps.yml) alerts when
  # latest_handshake_seconds drifts > 5 min (PersistentKeepalive is 25s,
  # so 5 min of nothing is a real outage, not a hiccup).

  - job_name: wireguard_exporter
    static_configs:
      - targets: ["wireguard_gateway:9586"]
        labels:
          host: pi-tale-node

  # --- VPS exporters via WireGuard ---------------------------------------
  #
  # All VPS targets are reachable via the WG overlay (default 10.50.0.2).
  # File-SD per exporter type so adding/removing a VPS is a one-line edit
  # in prometheus/targets/vps-*.yml — no Prometheus reload-loop required.
  #
  # `host: vps` label lets dashboards filter Pi vs VPS in one expression.

  - job_name: vps_node
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/vps-node-*.yml
        refresh_interval: 1m

  - job_name: vps_cadvisor
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/vps-cadvisor-*.yml
        refresh_interval: 1m

  - job_name: vps_nginx
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/vps-nginx-*.yml
        refresh_interval: 1m

  - job_name: vps_postgres
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/vps-postgres-*.yml
        refresh_interval: 1m

  # --- WiFi RF probe (compose/probes.yml) ---------------------------------
  #
  # The wifi_exporter container runs with `network_mode: host`, so its
  # listener is bound on the host directly. To keep it off the LAN, it
  # binds on the pitale bridge gateway IP (default 172.31.0.1, set in
  # compose/core.yml IPAM). Prometheus reaches it via
  # `host.docker.internal`, which the docker daemon maps to that same
  # gateway IP (via `extra_hosts: host-gateway` in compose/core.yml).
  #
  # The exporter is optional — if you do not stack probes.yml, this scrape
  # will fail with connection refused and the job will be DOWN. That is
  # fine; remove it (or guard with --enable-feature=…) if it bothers you.

  - job_name: wifi_exporter
    static_configs:
      - targets: ["host.docker.internal:9116"]
        labels:
          host: pi-tale-node

  - job_name: blackbox_tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/blackbox-tcp-*.yml
        refresh_interval: 1m
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox_exporter:9115

  # --- Future targets (UniFi, SNMP, custom) -------------------------------
  #
  # Generic file_sd that picks up anything under targets/static-*.yml
  # with a label `job` to namespace them. Use it for one-off exporters
  # you do not want a dedicated scrape config for.

  - job_name: file_sd
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/static-*.yml
        refresh_interval: 1m
