# Example blackbox ICMP targets — duplicate this file as
# `blackbox-icmp-<your-site>.yml` and replace the addresses with your own.
#
# Each entry under `targets` is an IP or hostname Prometheus should ping
# via the blackbox_exporter. Labels propagate to the resulting series.

- targets:
    - 1.1.1.1
    - 8.8.8.8
  labels:
    kind: extranet
    role: dns

