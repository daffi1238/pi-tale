# pi-tale — ICMP liveness probes for the local network.
#
# Picked up automatically by Prometheus via file_sd
# (see prometheus.yml -> job_name: blackbox_icmp).
# Edit / extend this file freely — no Prometheus reload needed
# beyond the 1m refresh_interval.

- targets:
    - 192.168.1.1
    - 192.168.1.2
    - 192.168.0.1
  labels:
    kind: intranet
    subnet: "192.168"

- targets:
    - 10.10.10.10
    - 10.10.10.20
    - 10.10.10.30
    - 10.10.10.40
    - 10.10.10.50
  labels:
    kind: intranet
    subnet: "10.10.10"

# UniFi access points. Static IPs reassigned 2026-07-16. Per-AP blocks so
# each carries its own `name` label (labels apply to the whole block).
# The UniFi poller already tracks these by MAC; these ICMP probes add
# independent up/down + latency per AP.
- targets:
    - 192.168.1.110
  labels:
    kind: intranet
    subnet: "192.168"
    role: ap
    name: AP-Entry
- targets:
    - 192.168.1.111
  labels:
    kind: intranet
    subnet: "192.168"
    role: ap
    name: AP-Reception
- targets:
    - 192.168.1.112
  labels:
    kind: intranet
    subnet: "192.168"
    role: ap
    name: AP-Backyard
