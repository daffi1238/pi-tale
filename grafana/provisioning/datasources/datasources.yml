# Grafana provisioned datasources.
# This file is mounted at /etc/grafana/provisioning/datasources and is
# applied automatically on Grafana startup.

apiVersion: 1

datasources:

  - name: Prometheus
    uid: pitale-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "30s"
      manageAlerts: true
      prometheusType: Prometheus

  - name: Loki
    uid: pitale-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000

  - name: Alertmanager
    uid: pitale-alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    editable: false
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false
