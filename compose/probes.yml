# pi-tale — probes layer.
#
# Optional exporters that sit alongside the core stack. Right now just
# the WiFi RF probe; wireguard_exporter moved to compose/wireguard.yml
# (it needs to share the gateway's netns to see wg0).
#
# This is a SEPARATE compose project from core (same pattern as
# extras.yml). Bring it up next to the core stack with:
#
#   docker compose -f compose/probes.yml --env-file compose/.env up -d
#
# Prometheus reaches the exporter through host.docker.internal:9116 — the
# matching `extra_hosts: host-gateway` mapping lives in compose/core.yml.
#
# The WiFi exporter needs the host's wlan interface, which only exists
# in the host network namespace — hence `network_mode: host` and the
# matching NET_ADMIN/NET_RAW capabilities.

name: pi-tale-probes

# No network block: services using `network_mode: host` cannot also join a
# user-defined bridge. If you add a probe that should join the core
# `pitale` network instead, declare it here as `external: true` (see
# extras.yml for the pattern).

services:

  wifi_exporter:
    build:
      context: ../exporters/wifi
    image: pi-tale/wifi-exporter:0.1.0
    container_name: pitale-wifi-exporter
    hostname: pitale-wifi-exporter
    restart: unless-stopped
    # Host networking is required: the kernel exposes wlan netdevs only
    # in the host network namespace. To avoid the listener also being
    # reachable from the LAN, the exporter binds on the docker0 bridge
    # gateway IP (172.17.0.1 — Docker's default, set up automatically
    # on engine start and not used by anything else here) instead of
    # 0.0.0.0. That IP is exactly what `host-gateway` resolves to in
    # the `extra_hosts: host.docker.internal:host-gateway` mapping in
    # compose/core.yml, so Prometheus inside the pitale bridge keeps
    # reaching the exporter at `host.docker.internal:9116`.
    network_mode: host
    cap_add:
      - NET_ADMIN   # ip link set <iface> up, trigger scan
      - NET_RAW     # kernel-level scan socket
    environment:
      WIFI_IFACE: ${WIFI_IFACE:-wlan1}
      WIFI_SCAN_INTERVAL: ${WIFI_SCAN_INTERVAL:-30}
      WIFI_SCAN_TIMEOUT: ${WIFI_SCAN_TIMEOUT:-20}
      WIFI_SSID_PATTERNS: ${WIFI_SSID_PATTERNS:-MOVISTAR-WIFI6-C738*,vodafone317B*,HCN-Wifi*}
      # Bind on docker0, not 0.0.0.0. Override only if your daemon
      # uses a non-default docker0 subnet (`docker network inspect bridge`).
      WIFI_LISTEN_HOST: ${WIFI_LISTEN_HOST:-172.17.0.1}
      WIFI_LISTEN_PORT: ${WIFI_LISTEN_PORT:-9116}
      WIFI_HASH_SSID: ${WIFI_HASH_SSID:-0}
    # No volumes: the exporter is stateless. Logs go to stdout and are
    # picked up by Promtail through the standard docker socket mount.
