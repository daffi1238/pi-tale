# pi-tale — UniFi Network layer.
#
# Three containers:
#
#   - mongo                       MongoDB 4.4 — Unifi controller's DB.
#                                 Last arm64-published major. Auth on.
#                                 Bridge net, port published to loopback.
#   - unifi-network-application   LinuxServer build of the Network app.
#                                 Holds sites, devices, SSIDs, port
#                                 profiles. UI on :8443. HOST NETWORKING.
#   - unifi-poller                golift's scraper. Talks to the
#                                 controller's API and exposes
#                                 /metrics on :9130 for Prometheus.
#                                 Bridge net, reaches controller via
#                                 host-gateway.
#
# Separate compose project — bring it up alongside core, not stacked:
#
#   make unifi
#   # or:  docker compose -f compose/unifi.yml --env-file compose/.env up -d
#
# Why host networking on the controller: L2 device discovery (10001/udp
# broadcast) does not cross the docker bridge, so new APs/switches were
# not appearing in "Devices → Pending Adoption". With host networking,
# the controller shares the Pi's stack and receives the broadcasts.
#
# Trade-off: 8443 (UI) is exposed to the LAN with the self-signed cert,
# since UniFi binds 0.0.0.0 inside its netns and there is no published-
# port indirection to filter on. Restrict access at the host firewall
# if that matters.

name: pi-tale-unifi

networks:
  pitale:
    name: pitale
    external: true

services:

  mongo:
    # PIN to 4.4.18. The :4.4 tag now points to 4.4.19+, which requires
    # ARMv8.2-A — Cortex-A72 (Pi 4) is ARMv8-A and crashes with
    # "Illegal instruction" on start. See
    # https://github.com/docker-library/mongo/issues/485#issuecomment-970864306
    image: mongo:4.4.18
    container_name: pitale-unifi-mongo
    hostname: mongo
    restart: unless-stopped
    environment:
      # Root credentials guard the admin DB. Created on first init.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS:?MONGO_ROOT_PASS not set — fill compose/.env}
      # Used by the init script below to create the per-app user.
      UNIFI_DB_USER: ${UNIFI_DB_USER:-unifi}
      UNIFI_DB_PASS: ${UNIFI_DB_PASS:?UNIFI_DB_PASS not set — fill compose/.env}
      UNIFI_DB_NAME: ${UNIFI_DB_NAME:-unifi}
    volumes:
      - ${DATA_DIR:-../data}/unifi/db:/data/db
      # Runs ONLY on first init (when /data/db is empty). Creates a
      # per-app user with dbOwner on the unifi + unifi_stat databases,
      # which is what unifi-network-application expects to authenticate
      # against. See unifi/mongo-init.sh.
      - ../unifi/mongo-init.sh:/docker-entrypoint-initdb.d/init-mongo.sh:ro
    networks: [pitale]
    ports:
      # Publish to loopback only so the host-networked controller can
      # reach mongo via 127.0.0.1 without exposing the DB to the LAN.
      - "127.0.0.1:27017:27017"
    deploy:
      resources:
        limits:
          memory: 384M
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  unifi:
    image: lscr.io/linuxserver/unifi-network-application:8.5.6
    container_name: pitale-unifi
    hostname: unifi
    restart: unless-stopped
    # Host networking so L2 discovery broadcasts (10001/udp) reach the
    # controller and new devices show up in "Pending Adoption". The
    # `networks` and `ports` sections cannot coexist with this — UniFi
    # binds 8443/8080/3478 directly on the Pi's stack.
    network_mode: host
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ:-Etc/UTC}
      # Mongo is published on the host's loopback (see the mongo
      # service). Reach it via 127.0.0.1 from this netns.
      MONGO_HOST: 127.0.0.1
      MONGO_PORT: "27017"
      MONGO_USER: ${UNIFI_DB_USER:-unifi}
      MONGO_PASS: ${UNIFI_DB_PASS}
      MONGO_DBNAME: ${UNIFI_DB_NAME:-unifi}
      # Stats DB name (UniFi convention: same prefix + `_stat`).
      MONGO_AUTHSOURCE: ${UNIFI_DB_NAME:-unifi}
      # Cap JVM heap so the container respects the mem_limit below
      # without the JVM dying with "OOMKilled" on first GC pressure.
      MEM_LIMIT: "768"
      MEM_STARTUP: "256"
    volumes:
      - ${DATA_DIR:-../data}/unifi/app:/config
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      # The controller takes 30-60s to initialise on first start (Java +
      # Mongo schema). 8443 returns 200 once it's serving.
      test: ["CMD", "curl", "-fks", "https://127.0.0.1:8443/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  unifi_poller:
    # The project is "unpoller" but the image is still published under
    # the historical `golift/unifi-poller` name on Docker Hub. The
    # ghcr.io/unpoller/* registry only carries a deprecated v2 line.
    image: golift/unifi-poller:v3.2.0
    container_name: pitale-unifi-poller
    hostname: unifi_poller
    restart: unless-stopped
    depends_on:
      unifi:
        condition: service_healthy
    # The controller is on host networking, so its UI is on the Pi's
    # stack, not in this bridge. `host.docker.internal` is mapped to the
    # host gateway so we can reach 127.0.0.1:8443 from inside the bridge.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # See https://unpoller.com/docs/install/configuration for the full
      # env-var surface. We default to a single site ("default") and the
      # built-in Prometheus output on :9130.
      UP_UNIFI_DEFAULT_URL: https://host.docker.internal:8443
      UP_UNIFI_DEFAULT_USER: ${UNIFI_POLLER_USER:?UNIFI_POLLER_USER not set — see docs/targets/unifi.md step 4}
      UP_UNIFI_DEFAULT_PASS: ${UNIFI_POLLER_PASS:?UNIFI_POLLER_PASS not set — see docs/targets/unifi.md step 4}
      # Skip TLS verify — the controller serves its self-signed cert.
      UP_UNIFI_DEFAULT_VERIFY_SSL: "false"
      UP_UNIFI_DEFAULT_SAVE_DPI: "false"
      UP_UNIFI_DEFAULT_SAVE_IDS: "false"
      UP_PROMETHEUS_DISABLE: "false"
      UP_PROMETHEUS_HTTP_LISTEN: "0.0.0.0:9130"
      UP_INFLUXDB_DISABLE: "true"
      UP_LOKI_DISABLE: "true"
    networks: [pitale]
    deploy:
      resources:
        limits:
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:9130/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
