# pi-tale — Alertmanager configuration.
#
# By default every alert is sent to the `null` receiver — that means
# Prometheus alerts will fire and show up in the Alertmanager UI but no
# notifications are sent anywhere. To actually be paged:
#
#   1. Fill in the corresponding variables in compose/.env.
#   2. Uncomment the matching receiver block below.
#   3. Switch `route.receiver` to that receiver (or add it to a route).
#   4. `docker compose -f compose/core.yml restart alertmanager`.
#
# Note: this file is mounted read-only and does NOT auto-substitute
# environment variables. Put real values in here (in a real deployment
# the file ends up at /mnt/datos/pi-tale/config/alertmanager.yml on a
# disk that never leaves the Pi). Future work: render this file from a
# template at boot time using envsubst.

global:
  resolve_timeout: 5m
  # Used by the SMTP receiver when you enable it.
  # smtp_smarthost: 'smtp.example.com:587'
  # smtp_from: 'pi-tale@example.com'
  # smtp_auth_username: 'pi-tale@example.com'
  # smtp_auth_password: 'CHANGE_ME'
  # smtp_require_tls: true

route:
  receiver: 'null'
  group_by: ['alertname', 'severity', 'host']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Critical alerts deserve a faster repeat window once a receiver is
    # configured. Uncomment when you have a real receiver.
    # - matchers:
    #     - severity = critical
    #   receiver: 'telegram'
    #   repeat_interval: 1h
    - matchers:
        - alertname = Watchdog
      receiver: 'null'

inhibit_rules:
  # If we have lost the node, suppress per-probe alerts about that node.
  - source_matchers:
      - severity = critical
      - alertname = NodeExporterDown
    target_matchers:
      - severity =~ "warning|info"
    equal: ['host']

receivers:

  - name: 'null'

  # --- Telegram (uncomment to enable) -------------------------------------
  # - name: 'telegram'
  #   telegram_configs:
  #     - bot_token: 'CHANGE_ME_TELEGRAM_BOT_TOKEN'
  #       chat_id:    -1000000000000   # change to your chat id (negative for groups)
  #       parse_mode: 'HTML'
  #       message: |
  #         <b>{{ .CommonLabels.severity | toUpper }}</b> — {{ .CommonLabels.alertname }}
  #         {{ range .Alerts }}
  #         • {{ .Annotations.summary }}
  #           {{ .Annotations.description }}
  #         {{ end }}

  # --- Email / SMTP (uncomment to enable) ---------------------------------
  # Set the SMTP block under `global` above first.
  # - name: 'email'
  #   email_configs:
  #     - to: 'alerts@example.com'
  #       send_resolved: true
  #       headers:
  #         Subject: '[pi-tale][{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'

